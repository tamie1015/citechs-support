<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Technician Desk | CITECHS</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="CITECHS home">
        <img src="images/cis-logo.svg" alt="" class="brand-logo brand-logo-cis" />
        <img src="images/citechs-logo.svg" alt="" class="brand-logo brand-logo-citechs" />
        <span class="brand-text">
          <strong>CITECHS Desk</strong>
          <small>Technician chat support</small>
        </span>
      </a>
      <div class="header-actions">
        <span id="tech-user-label" class="user-chip"></span>
        <a id="admin-link" class="btn btn-ghost btn-nav" href="admin.html" hidden>Admin panel</a>
        <button id="logout-btn" class="btn btn-primary btn-nav" type="button">Log out</button>
      </div>
    </div>
  </header>

  <main class="chat-app">
    <aside class="ticket-sidebar">
      <div class="sidebar-head">
        <h1>Open tickets</h1>
        <button id="refresh-tickets" class="btn btn-ghost btn-tiny" type="button">Refresh</button>
      </div>
      <label class="filter-row">
        <span class="sr-only">Filter</span>
        <select id="status-filter">
          <option value="open">Open</option>
          <option value="closed">Closed</option>
          <option value="">All</option>
        </select>
      </label>
      <ul id="ticket-list" class="ticket-list"></ul>
    </aside>

    <section class="chat-panel">
      <div id="chat-empty" class="chat-empty">
        <img src="images/citechs-logo.svg" alt="" class="empty-logo" />
        <h2>Select a ticket to chat</h2>
        <p>Clients can message here only after submitting a support request.</p>
      </div>

      <div id="chat-active" class="chat-active" hidden>
        <header class="chat-header">
          <div>
            <h2 id="chat-title">Ticket</h2>
            <p id="chat-meta" class="muted"></p>
          </div>
          <div class="hero-actions">
            <button id="reopen-ticket-btn" class="btn btn-ghost" type="button" hidden>Reopen ticket</button>
            <button id="close-ticket-btn" class="btn btn-ghost" type="button">Close ticket</button>
          </div>
        </header>
        <div id="message-list" class="message-list" aria-live="polite"></div>
        <form id="reply-form" class="composer">
          <label class="sr-only" for="reply-body">Message</label>
          <textarea id="reply-body" rows="2" placeholder="Type a reply to the client…" required></textarea>
          <button class="btn btn-primary" type="submit">Send</button>
        </form>
      </div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/technician.js"></script>
</body>
</html>
