<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Login | CITECHS</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="auth-body">
  <main class="auth-shell">
    <section class="auth-card">
      <div class="auth-brand">
        <img src="images/cis-logo.svg" alt="Calamba Integrated School" class="brand-logo brand-logo-cis" />
        <img src="images/citechs-logo.svg" alt="CITECHS logo" class="brand-logo brand-logo-citechs" />
      </div>
      <p class="eyebrow">Staff only</p>
      <h1>Technician &amp; Admin Login</h1>
      <p class="lead">Sign in with an account created by the administrator.</p>

      <form id="login-form" class="support-form auth-form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required autocomplete="current-password" />
        </div>
        <p id="login-error" class="field-error" hidden></p>
        <button class="btn btn-primary" type="submit">Sign in</button>
      </form>

      <p class="auth-note">
        Temporary default admin (change after first login): <strong>admin</strong> / <strong>ChangeMe@CIS</strong>
      </p>
      <p><a href="index.html">← Back to public site</a></p>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script src="js/staff-login.js"></script>
</body>
</html>
